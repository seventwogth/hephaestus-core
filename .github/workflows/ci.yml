name: CI

on:
  pull_request:
    branches:
      - main
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  core:
    name: Core workspace
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Check lockfile consistency
        run: npm run check:lockfile

      - name: Run tests
        run: npm test

      - name: Run typecheck
        run: npm run typecheck

      - name: Build packages
        run: npm run build

  generated-webapp:
    name: Generated webapp template
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: packages/templates/generated-webapp/frontend/package-lock.json

      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          go-version: 1.24.x
          cache-dependency-path: packages/templates/generated-webapp/backend/go.sum

      - name: Validate Docker Compose config
        working-directory: packages/templates/generated-webapp
        run: docker compose config

      - name: Test backend
        working-directory: packages/templates/generated-webapp/backend
        run: go test ./...

      - name: Install frontend dependencies
        working-directory: packages/templates/generated-webapp/frontend
        run: npm ci

      - name: Test frontend
        working-directory: packages/templates/generated-webapp/frontend
        run: npm test

      - name: Build frontend
        working-directory: packages/templates/generated-webapp/frontend
        run: npm run build
